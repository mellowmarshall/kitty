# The fork's declaration for the host guards and the host ship queue
# (mellowmarshall/devtools host-guards and ship-queue). Upstream kitty does
# not have this file; changes meant for upstream leave it out.
base_ref=origin/master
trunk_branch=master

# --- How the fork ships ---------------------------------------------------------
# The queue reads these keys at one origin/master sha per job and runs
# scripts/ship/ship-steps.sh as committed there.
ship_repo=kitty
ship_gh_repo=mellowmarshall/kitty
ship_worktree_root=/data/Dev/kitty
ship_body_check=scripts/ship/ship-steps.sh body
# CI: build kitty and run its whole test suite, on the remote worker when the
# queue picks one (the step brings its own build headers).
ship_ci=scripts/ship/ship-steps.sh ci
ship_merge=scripts/ship/ship-steps.sh merge
# The 500-line ratchet: upstream's files over the limit are listed with their
# lines in the baseline, written by `scripts/ship/ship-steps.sh baseline REF`
# (after a merge of upstream, or when a change adds lines to an upstream
# file; the entry then says how many). The fork's own source stays under 500.
ship_size_baseline=scripts/ship/size-baseline.json
# What a kitty build writes, so cleanup can remove a merged worktree. Never
# ship from a worktree a running kitty uses (the /data/Dev/kitty/current
# target): cleanup removes it once merged.
ship_disposable=*_generated*
ship_disposable=dependencies
ship_disposable=fonts
ship_disposable=glfw/wayland-*-client-protocol.*
ship_disposable=kittens/ask/*_generated*
